name: Devices

# The Android app on an Android emulator, used the way a person would: notifications, leaving and
# locking during a session, a friend request while it is closed, a sanctuary. Fails on any crash.
# The friend parts use the live friends server with two throwaway profiles, deleted at the end.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The address of the live server is built in, as in the store app. Otherwise the app asks the
      # website at start, and a freshly booted emulator's network is not always up in time.
      - name: Build the web app with the server's address
        run: |
          api="${{ vars.HAVEN_API_URL || '' }}"
          [ -n "$api" ] || api=$(curl -fsS --retry 3 https://shira421.github.io/haven/config.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).api||''))") || true
          [ -n "$api" ] || echo "::warning::No server address found; the app will look it up when it starts."
          HAVEN_API_URL="$api" npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the APK, with the web view open to the test
        working-directory: android
        env:
          HAVEN_WEB_DEBUG: "1"
        run: gradle :app:assembleDebug
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the app on Android (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node tests/android-device.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-${{ matrix.api }}
          path: tests/output/android-*
          retention-days: 7
